<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean View Resort | Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="page">
    <section class="card">
        <p class="eyebrow">Ocean View Resort</p>
        <h1>Staff Login</h1>
        <p class="subtitle">Use your assigned credentials to access the reservation system.</p>

        <form id="loginForm" class="form" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
        <!--<p class="hint">Demo credentials: <strong>admin / admin123</strong></p> -->
    </section>
</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "Authenticating...";
        message.className = "message pending";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            message.textContent = "Username and password are required.";
            message.className = "message error";
            return;
        }

        try {
            const response = await fetch("/api/v1/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (response.ok && data.success) {
                message.textContent = data.message;
                message.className = "message success";
                return;
            }

            message.textContent = data.message || "Login failed.";
            message.className = "message error";
        } catch (error) {
            message.textContent = "Unable to connect to server.";
            message.className = "message error";
        }
    });
</script>
</body>
</html>
